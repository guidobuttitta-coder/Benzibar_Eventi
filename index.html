<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benzibar</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
--bg-color: #87A381;
--text-color: #798E76;
--card-bg: #ffffff;
--btn-bg: #798E76;
--btn-text: #ffffff;
}
body {
background-color: var(--bg-color);
font-family: 'Comfortaa', cursive, sans-serif;
color: var(--text-color);
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
box-sizing: border-box;
}
h1, h2, h3, p, label, button, input, select {
font-family: 'Comfortaa', cursive, sans-serif;
color: var(--text-color);
}
.container {
width: 100%;
max-width: 600px;
background: var(--card-bg);
padding: 30px;
border-radius: 15px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
box-sizing: border-box;
text-align: center;
margin-bottom: 20px;
}
.brand-logo {
max-width: 200px;
height: auto;
display: block;
margin: 0 auto 15px;
}
.brand-name {
font-size: 2.5rem;
font-weight: bold;
margin: 0 0 25px 0;
}
button, .btn {
background-color: var(--btn-bg);
color: var(--btn-text);
border: none;
padding: 12px 20px;
margin: 10px 0;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
width: 100%;
box-sizing: border-box;
transition: opacity 0.2s;
}
button:hover {
opacity: 0.9;
}
.btn-install {
background-color: #5d725a;
border: 2px solid #ffffff;
margin-top: 15px;
}
.btn-home {
background-color: #5d725a;
margin-top: 20px;
}
input, select {
width: 100%;
padding: 10px;
margin: 10px 0;
border: 2px solid var(--text-color);
border-radius: 6px;
box-sizing: border-box;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
font-size: 0.9rem;
}
table, th, td {
border: 1px solid var(--text-color);
}
th, td {
padding: 8px;
text-align: left;
}
th {
background-color: rgba(121, 142, 118, 0.2);
}
.event-card {
border: 2px solid var(--text-color);
border-radius: 10px;
padding: 15px;
margin: 15px 0;
text-align: left;
background: #fafafa;
}
.event-card img {
max-width: 100%;
height: auto;
border-radius: 6px;
margin-bottom: 10px;
}
.badge-enrolled {
background-color: #5d725a;
color: white;
padding: 5px 10px;
border-radius: 4px;
font-size: 0.8rem;
display: inline-block;
margin-bottom: 10px;
}
.section-subtitle {
margin-top: 20px;
margin-bottom: 10px;
font-size: 1.1rem;
border-bottom: 2px solid var(--text-color);
padding-bottom: 5px;
}
.sync-status {
font-size: 0.75rem;
color: #5d725a;
margin-top: 15px;
}
</style>
</head>
<body>
<!-- SCHERMATA SPLASH -->
<div id="screen-splash" class="container">
<img src="logo-benzibar.png" alt="Logo Benzibar" class="brand-logo" onerror="this.style.display='none'">
<h1 class="brand-name">benzibar</h1>
<button id="btn-naviga" onclick="goToScreen('screen-user-register')">NAVIGA</button>
<button id="btn-install-app" class="btn-install" style="display:none;">📲 INSTALLA APP BENZIBAR</button>
</div>
<!-- SCHERMATA REGISTRAZIONE OBBLIGATORIA -->
<div id="screen-user-register" class="container" style="display:none;">
<h2>REGISTRAZIONE UTENTE</h2>
<p>Inserisci i tuoi dati obbligatori:</p>
<input type="text" id="reg-name" placeholder="Nome">
<input type="text" id="reg-surname" placeholder="Cognome">
<input type="tel" id="reg-phone" placeholder="Numero di Telefono">
<button onclick="saveUserProfile()">SALVA CREDENZIALI</button>
<button class="btn-home" onclick="goToScreen('screen-splash')">INDIETRO</button>
</div>
<!-- SCHERMATA HOME PRINCIPALE -->
<div id="screen-home" class="container" style="display:none;">
<img src="logo-benzibar.png" alt="Logo Benzibar" class="brand-logo" onerror="this.style.display='none'" style="max-width: 120px;">
<h1 class="brand-name" style="font-size: 1.8rem;">benzibar</h1>
<div id="user-info-bar" style="margin-bottom: 15px; font-weight: bold; color: #5d725a;"></div>
<div id="user-active-events-section" style="display:none;">
<h3 class="section-subtitle">I TUOI EVENTI</h3>
<div id="home-user-events-list"></div>
</div>
<button onclick="goToScreen('screen-events')">PROSSIMI EVENTI</button>
<button onclick="openStaffLogin()">ACCESSO RISERVATO STAFF</button>
<button onclick="goToScreen('screen-user-register')" style="background-color: #a97676; font-size: 0.85rem; padding: 8px;">CAMBIA UTENTE / REGISTRATI DI NUOVO</button>
<div class="sync-status" id="sync-indicator">🟢 Connessione Cloud Attiva</div>
</div>
<!-- SCHERMATA LOGIN STAFF -->
<div id="screen-staff-login" class="container" style="display:none;">
<h2>ACCESSO STAFF</h2>
<input type="password" id="staff-password" placeholder="Inserisci password">
<button onclick="verifyStaffPassword()">ACCEDI</button>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>
<!-- SCHERMATA PANNELLO STAFF -->
<div id="screen-staff-dashboard" class="container" style="display:none;">
<h2>PANNELLO STAFF</h2>
<button onclick="goToScreen('screen-create-event')">CREA NUOVO EVENTO</button>
<button onclick="showRegisteredUsersTable()">UTENTI REGISTRATI</button>
<button onclick="showStaffEventsList()">GESTIONE EVENTI & ISCRITTI</button>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>
<!-- SCHERMATA CREAZIONE EVENTO -->
<div id="screen-create-event" class="container" style="display:none;">
<h2>CREA EVENTO</h2>
<input type="file" id="event-img-file" accept="image/*">
<input type="text" id="event-datetime" placeholder="Data e Orario">
<select id="event-type">
<option value="Torneo Burraco">Torneo Burraco</option>
<option value="Altro Evento">Altro Evento</option>
</select>
<button onclick="createNewEvent()">PUBBLICA EVENTO</button>
<button class="btn-home" onclick="goToScreen('screen-staff-dashboard')">INDIETRO</button>
</div>
<!-- SCHERMATA GESTIONE EVENTI STAFF & TABELLE -->
<div id="screen-staff-management" class="container" style="display:none;">
<h2 id="staff-management-title">GESTIONE EVENTI</h2>
<div id="staff-management-content"></div>
<button class="btn-home" onclick="goToScreen('screen-staff-dashboard')">INDIETRO</button>
</div>
<!-- SCHERMATA PROSSIMI EVENTI (UTENTE) -->
<div id="screen-events" class="container" style="display:none;">
<h2>PROSSIMI EVENTI</h2>
<div id="public-events-list"></div>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>
<!-- SCHERMATA MODIFICA PARTECIPAZIONE -->
<div id="screen-edit-participation" class="container" style="display:none;">
<h2>MODIFICA PARTECIPAZIONE</h2>
<div id="edit-participation-form-container"></div>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>
<script>
// --- GESTIONE PWA E INSTALLAZIONE APP ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
const btnInstall = document.getElementById('btn-install-app');
if (btnInstall) btnInstall.style.display = 'block';
});
document.getElementById('btn-install-app').addEventListener('click', () => {
if (deferredPrompt) {
deferredPrompt.prompt();
deferredPrompt.userChoice.then((choiceResult) => {
if (choiceResult.outcome === 'accepted') {
console.log('L'utente ha accettato l'installazione');
}
deferredPrompt = null;
});
}
});
// --- GESTIONE FIREBASE ---
const firebaseConfig = { databaseURL: "https://benzibar-app-default-rtdb.firebaseio.com" };
let dbRef = null;
try {
firebase.initializeApp(firebaseConfig);
dbRef = firebase.database().ref();
} catch(e) { console.log("Errore Firebase:", e); }
function cleanPhoneKey(phone) {
if (!phone) return '';
return String(phone).replace(/[^0-9+]/g, '');
}
let savedUserRaw = localStorage.getItem('benzibar_user_profile');
let localUserProfile = savedUserRaw ? JSON.parse(savedUserRaw) : null;
let db = { users: {}, events: {}, registrations: {} };
// --- CAMBIO SCHERMATE SENZA ERRORI ---
function goToScreen(screenId) {
const screens = document.querySelectorAll('.container');
screens.forEach(el => {
el.style.display = 'none';
});
const target = document.getElementById(screenId);
if (target) {
target.style.display = 'block';
}
if (screenId === 'screen-home') updateHomeView();
else if (screenId === 'screen-events') renderPublicEvents();
}
if (dbRef) {
dbRef.on('value', (snapshot) => {
const data = snapshot.val() || {};
db.users = data.users || {};
db.events = data.events || {};
db.registrations = data.registrations || {};
const indicator = document.getElementById('sync-indicator');
if (indicator) indicator.innerText = "🟢 Connessione Cloud Attiva";
updateHomeView();
if (document.getElementById('screen-events').style.display === 'block') renderPublicEvents();
}, (error) => {
const indicator = document.getElementById('sync-indicator');
if (indicator) indicator.innerText = "🔴 Disconnesso (offline)";
});
}
function updateHomeView() {
const infoBar = document.getElementById('user-info-bar');
const activeSection = document.getElementById('user-active-events-section');
const listDiv = document.getElementById('home-user-events-list');
if (!infoBar) return;
if (localUserProfile && localUserProfile.name) {
infoBar.innerText = ⁠Benvenuto, ${localUserProfile.name} ${localUserProfile.surname}!⁠;
} else {
infoBar.innerText = '';
if (activeSection) activeSection.style.display = 'none';
return;
}
const currentPhoneKey = cleanPhoneKey(localUserProfile.phone);
const userRegKeys = Object.keys(db.registrations).filter(k => {
const reg = db.registrations[k];
return reg && cleanPhoneKey(reg.userPhone) === currentPhoneKey;
});
if (userRegKeys.length === 0) {
if (activeSection) activeSection.style.display = 'none';
if (listDiv) listDiv.innerHTML = '';
return;
}
if (activeSection) activeSection.style.display = 'block';
let html = '';
userRegKeys.forEach(key => {
const userReg = db.registrations[key];
const ev = db.events[userReg.eventId];
if (ev) {
html += ⁠<div class="event-card"><span class="badge-enrolled">ISCRITTO</span>${ev.img ? ⁠<img src="${ev.img}">⁠ : ''}<h3>${ev.type}</h3><p><b>Data:</b> ${ev.datetime}</p><button onclick="openRegistrationModal('${ev.id}')">MODIFICA</button><button onclick="cancelRegistration('${ev.id}')" style="background-color: #a97676;">CANCELLA</button></div>⁠;
}
});
if (listDiv) listDiv.innerHTML = html;
}
function openStaffLogin() {
goToScreen('screen-staff-login');
}
function verifyStaffPassword() {
const pass = document.getElementById('staff-password').value;
if (pass === 'BENZIBAR') goToScreen('screen-staff-dashboard');
else alert('Password errata!');
}
let uploadedImageBase64 = "";
const imgFileInput = document.getElementById('event-img-file');
if (imgFileInput) {
imgFileInput.addEventListener('change', function(e) {
const file = e.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(evt) { uploadedImageBase64 = evt.target.result; };
reader.readAsDataURL(file);
}
});
}
function createNewEvent() {
const datetime = document.getElementById('event-datetime').value.trim();
const type = document.getElementById('event-type').value;
if (!datetime) { alert('Inserisci data e orario.'); return; }
const newId = 'ev_' + Date.now();
if (dbRef) dbRef.child('events').child(newId).set({ id: newId, img: uploadedImageBase64, datetime, type });
alert('Evento pubblicato!');
goToScreen('screen-staff-dashboard');
}
function showRegisteredUsersTable(changeScreen = true) {
if (changeScreen) goToScreen('screen-staff-management');
document.getElementById('staff-management-title').innerText = 'UTENTI REGISTRATI';
const container = document.getElementById('staff-management-content');
const usersList = Object.values(db.users);
if (usersList.length === 0) { container.innerHTML = '<p>Nessun utente.</p>'; return; }
let html = ⁠<table id="users-table"><tr><th>Nome</th><th>Cognome</th><th>Telefono</th></tr>⁠;
usersList.forEach(u => { html += ⁠<tr><td>${u.name||'-'}</td><td>${u.surname||'-'}</td><td>${u.phone||'-'}</td></tr>⁠; });
container.innerHTML = html + '</table>';
}
function showStaffEventsList(changeScreen = true) {
if (changeScreen) goToScreen('screen-staff-management');
document.getElementById('staff-management-title').innerText = 'GESTIONE EVENTI';
const container = document.getElementById('staff-management-content');
const eventsList = Object.values(db.events);
if (eventsList.length === 0) { container.innerHTML = '<p>Nessun evento.</p>'; return; }
let html = '';
eventsList.forEach(ev => {
html += ⁠<div class="event-card"><h3>${ev.type}</h3><p>${ev.datetime}</p><button onclick="deleteEvent('${ev.id}')" style="background-color: #a97676;">CANCELLA</button></div>⁠;
});
container.innerHTML = html;
}
function deleteEvent(eventId) {
if (confirm('Eliminare evento?')) {
if (dbRef) dbRef.child('events').child(eventId).remove();
showStaffEventsList(false);
}
}
function saveUserProfile() {
const name = document.getElementById('reg-name').value.trim();
const surname = document.getElementById('reg-surname').value.trim();
const phone = document.getElementById('reg-phone').value.trim();
if (!name || !surname || !phone) { alert('Compila tutti i campi obbligatori.'); return; }
localUserProfile = { name, surname, phone };
localStorage.setItem('benzibar_user_profile', JSON.stringify(localUserProfile));
const key = cleanPhoneKey(phone);
if (dbRef && key) {
dbRef.child('users').child(key).set(localUserProfile);
}
alert('Credenziali salvate!');
goToScreen('screen-home');
}
function renderPublicEvents() {
const container = document.getElementById('public-events-list');
const eventsList = Object.values(db.events);
if (eventsList.length === 0) { container.innerHTML = '<p>Nessun evento.</p>'; return; }
let html = '';
eventsList.forEach(ev => {
html += ⁠<div class="event-card"><h3>${ev.type}</h3><p>${ev.datetime}</p><button onclick="openRegistrationModal('${ev.id}')">ISCRIVITI</button></div>⁠;
});
container.innerHTML = html;
}
function openRegistrationModal(eventId) {
if (!localUserProfile) { goToScreen('screen-user-register'); return; }
goToScreen('screen-edit-participation');
const ev = db.events[eventId];
document.getElementById('edit-participation-form-container').innerHTML = ⁠<h3>${ev.type}</h3><button onclick="confirmRegistration('${ev.id}')">CONFERMA</button>⁠;
}
function confirmRegistration(eventId) {
const regId = eventId + '_' + cleanPhoneKey(localUserProfile.phone);
if (dbRef) dbRef.child('registrations').child(regId).set({ id: regId, eventId, userPhone: localUserProfile.phone, userName: localUserProfile.name, userSurname: localUserProfile.surname });
alert('Iscritto!');
goToScreen('screen-home');
}
function cancelRegistration(eventId) {
if (confirm('Cancellare iscrizione?')) {
if (dbRef) dbRef.child('registrations').child(eventId + '_' + cleanPhoneKey(localUserProfile.phone)).remove();
updateHomeView();
}
}
</script>
</body>
</html>
