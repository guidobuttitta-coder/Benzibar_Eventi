<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benzibar</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
--bg-color: #87A381;
--text-color: #798E76;
--card-bg: #ffffff;
--btn-bg: #798E76;
--btn-text: #ffffff;
}
body {
background-color: var(--bg-color);
font-family: 'Comfortaa', cursive, sans-serif;
color: var(--text-color);
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
box-sizing: border-box;
}
h1, h2, h3, p, label, button, input, select {
font-family: 'Comfortaa', cursive, sans-serif;
color: var(--text-color);
}
.container {
width: 100%;
max-width: 600px;
background: var(--card-bg);
padding: 30px;
border-radius: 15px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
box-sizing: border-box;
text-align: center;
margin-bottom: 20px;
}
.brand-logo {
max-width: 200px;
height: auto;
display: block;
margin: 0 auto 15px;
}
.brand-name {
font-size: 2.5rem;
font-weight: bold;
margin: 0 0 25px 0;
}
button, .btn {
background-color: var(--btn-bg);
color: var(--btn-text);
border: none;
padding: 12px 20px;
margin: 10px 0;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
width: 100%;
transition: opacity 0.2s;
}
button:hover {
opacity: 0.9;
}
.btn-home {
background-color: #5d725a;
margin-top: 20px;
}
input, select {
width: 100%;
padding: 10px;
margin: 10px 0;
border: 2px solid var(--text-color);
border-radius: 6px;
box-sizing: border-box;
}
.hidden {
display: none !important;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
font-size: 0.9rem;
}
table, th, td {
border: 1px solid var(--text-color);
}
th, td {
padding: 8px;
text-align: left;
}
th {
background-color: rgba(121, 142, 118, 0.2);
}
.event-card {
border: 2px solid var(--text-color);
border-radius: 10px;
padding: 15px;
margin: 15px 0;
text-align: left;
background: #fafafa;
}
.event-card img {
max-width: 100%;
height: auto;
border-radius: 6px;
margin-bottom: 10px;
}
.badge-enrolled {
background-color: #5d725a;
color: white;
padding: 5px 10px;
border-radius: 4px;
font-size: 0.8rem;
display: inline-block;
margin-bottom: 10px;
}
.section-subtitle {
margin-top: 20px;
margin-bottom: 10px;
font-size: 1.1rem;
border-bottom: 2px solid var(--text-color);
padding-bottom: 5px;
}
.sync-status {
font-size: 0.75rem;
color: #5d725a;
margin-top: 15px;
}
</style>
</head>
<body>

<div id="screen-splash" class="container">
<img src="logo-benzibar.png" alt="Logo Benzibar" class="brand-logo" onerror="this.style.display='none'">
<h1 class="brand-name">benzibar</h1>
<button id="btn-naviga" onclick="handleNavigaClick()">NAVIGA</button>
</div>

<div id="screen-user-register" class="container hidden">
<h2>REGISTRAZIONE UTENTE</h2>
<p>Inserisci i tuoi dati per procedere:</p>
<input type="text" id="reg-name" placeholder="Nome">
<input type="text" id="reg-surname" placeholder="Cognome">
<input type="tel" id="reg-phone" placeholder="Numero di Telefono">
<button onclick="saveUserProfile()">SALVA CREDENZIALI</button>
</div>

<div id="screen-home" class="container hidden">
<img src="logo-benzibar.png" alt="Logo Benzibar" class="brand-logo" onerror="this.style.display='none'" style="max-width: 120px;">
<h1 class="brand-name" style="font-size: 1.8rem;">benzibar</h1>
<div id="user-info-bar" style="margin-bottom: 15px; font-weight: bold; color: #5d725a;"></div>
<div id="user-active-events-section" class="hidden">
<h3 class="section-subtitle">I TUOI EVENTI</h3>
<div id="home-user-events-list"></div>
</div>
<button onclick="goToScreen('screen-events')">PROSSIMI EVENTI</button>
<button onclick="openStaffLogin()">ACCESSO RISERVATO STAFF</button>
<button id="btn-reset-profile" onclick="resetLocalProfile()" style="background-color: #a97676; font-size: 0.85rem; padding: 8px;">CAMBIA UTENTE / REGISTRATI DI NUOVO</button>
<div class="sync-status" id="sync-indicator">🟢 Connessione Cloud Attiva</div>
</div>

<div id="screen-staff-login" class="container hidden">
<h2>ACCESSO STAFF</h2>
<input type="password" id="staff-password" placeholder="Inserisci password">
<button onclick="verifyStaffPassword()">ACCEDI</button>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>

<div id="screen-staff-dashboard" class="container hidden">
<h2>PANNELLO STAFF</h2>
<button onclick="goToScreen('screen-create-event')">CREA NUOVO EVENTO</button>
<button onclick="showRegisteredUsersTable()">UTENTI REGISTRATI</button>
<button onclick="showStaffEventsList()">GESTIONE EVENTI & ISCRITTI</button>
<button class="btn-home" onclick="goToScreen('screen-home')">HOME</button>
</div>

<div id="screen-create-event" class="container hidden">
<h2>CREA EVENTO</h2>
<input type="file" id="event-img-file" accept="image/*">
<input type="text" id="event-datetime" placeholder="Data e Orario">
<select id="event-type">
<option value="Torneo Burraco">Torneo Burraco</option>
<option value="Altro Evento">Altro Evento</option>
</select>
<button onclick="createNewEvent()">PUBBLICA EVENTO</button>
